openapi: 3.0.3
info:
  title: LLM Gateway API
  version: 0.1.0
  description: |
    OpenAI-compatible gateway in front of OpenAI and Anthropic channels, with prepaid billing.

    * `/v1/*` uses an API key: `Authorization: Bearer sk-...`.
    * `/api/*` is the console API and uses the `session` cookie set by `/api/auth/login`.
    * Money is integer **micro-USD** (1 USD = 1,000,000). Prices are micro-USD per 1M tokens.
servers:
  - url: http://localhost:5173
    description: Docker Compose (web + reverse proxy)
  - url: http://localhost:8080
    description: Gateway directly
tags:
  - name: OpenAI-compatible
  - name: Auth
  - name: Keys
  - name: Billing
  - name: Admin

paths:
  /v1/chat/completions:
    post:
      tags: [OpenAI-compatible]
      summary: Create a chat completion
      description: |
        Reserves the estimated cost, tries enabled channels for the model in priority order, then settles
        the actual cost from the upstream token usage. Upstream 5xx, 429, timeouts and connection errors
        move on to the next channel; other 4xx are returned without failover and are not charged.
        `stream: true` is not supported.
      security: [{ apiKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChatRequest' }
            example: { model: gpt-4o-mini, messages: [{ role: user, content: Hello }] }
      responses:
        '200':
          description: Completion
          content: { application/json: { schema: { $ref: '#/components/schemas/ChatResponse' } } }
        '400': { $ref: '#/components/responses/OpenAIError' }
        '401': { $ref: '#/components/responses/OpenAIError' }
        '402':
          description: Balance too low (`code` = `insufficient_quota`)
          content: { application/json: { schema: { $ref: '#/components/schemas/OpenAIError' } } }
        '429':
          description: Per-key requests-per-minute limit exceeded (`code` = `rate_limit_exceeded`)
          content: { application/json: { schema: { $ref: '#/components/schemas/OpenAIError' } } }
        '502':
          description: Every channel failed (`code` = `upstream_unavailable`)
          content: { application/json: { schema: { $ref: '#/components/schemas/OpenAIError' } } }
        '503':
          description: No channel serves the model (`code` = `no_channel`)
          content: { application/json: { schema: { $ref: '#/components/schemas/OpenAIError' } } }
  /v1/models:
    get:
      tags: [OpenAI-compatible]
      summary: List models that have a price and at least one enabled channel
      security: [{ apiKey: [] }]
      responses:
        '200':
          description: Models
          content:
            application/json:
              schema:
                type: object
                properties:
                  object: { type: string, example: list }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, example: gpt-4o-mini }
                        object: { type: string, example: model }
                        owned_by: { type: string }
        '401': { $ref: '#/components/responses/OpenAIError' }

  /api/auth/register:
    post:
      tags: [Auth]
      summary: Create a developer account
      requestBody: { $ref: '#/components/requestBodies/Credentials' }
      responses:
        '201': { description: Created, content: { application/json: { schema: { type: object, properties: { user: { $ref: '#/components/schemas/User' } } } } } }
        '400': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /api/auth/login:
    post:
      tags: [Auth]
      summary: Sign in with email and password
      description: |
        Without two-factor, sets the `session` cookie. With two-factor enabled, returns
        `{"totp_required": true}` and sets a 5-minute `pending` cookie for `/api/auth/login/totp`.
      requestBody: { $ref: '#/components/requestBodies/Credentials' }
      responses:
        '200':
          description: Signed in, or second step required
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties: { user: { $ref: '#/components/schemas/User' } }
                  - type: object
                    properties: { totp_required: { type: boolean, example: true } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { description: Account disabled }
  /api/auth/login/totp:
    post:
      tags: [Auth]
      summary: Finish sign-in with an authenticator code
      requestBody: { $ref: '#/components/requestBodies/Code' }
      responses:
        '200': { description: Signed in; `session` cookie set }
        '401': { $ref: '#/components/responses/Error' }
  /api/auth/logout:
    post:
      tags: [Auth]
      summary: Clear the session cookies
      responses: { '204': { description: Signed out } }
  /api/me:
    get:
      tags: [Auth]
      summary: Current user
      security: [{ session: [] }]
      responses:
        '200': { description: User, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        '401': { $ref: '#/components/responses/Error' }
  /api/me/totp/setup:
    post:
      tags: [Auth]
      summary: Generate a TOTP secret (not active until enabled)
      security: [{ session: [] }]
      responses:
        '200':
          description: Secret
          content:
            application/json:
              schema:
                type: object
                properties:
                  otpauth_url: { type: string }
                  secret: { type: string }
        '409': { $ref: '#/components/responses/Error' }
  /api/me/totp/enable:
    post:
      tags: [Auth]
      summary: Turn on two-factor with a current code
      security: [{ session: [] }]
      requestBody: { $ref: '#/components/requestBodies/Code' }
      responses:
        '200': { description: Enabled }
        '400': { $ref: '#/components/responses/Error' }
  /api/me/totp/disable:
    post:
      tags: [Auth]
      summary: Turn off two-factor with a current code
      security: [{ session: [] }]
      requestBody: { $ref: '#/components/requestBodies/Code' }
      responses:
        '200': { description: Disabled }
        '400': { $ref: '#/components/responses/Error' }

  /api/keys:
    get:
      tags: [Keys]
      summary: List my API keys (no plaintext)
      security: [{ session: [] }]
      responses:
        '200': { description: Keys, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/APIKey' } } } } }
    post:
      tags: [Keys]
      summary: Create an API key; the plaintext key is returned only once
      security: [{ session: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [name], properties: { name: { type: string, maxLength: 100 } } } } }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: integer }
                  name: { type: string }
                  key: { type: string, example: sk-AbC... }
                  key_prefix: { type: string }
                  rpm_limit: { type: integer }
  /api/keys/{id}:
    patch:
      tags: [Keys]
      summary: Disable or re-enable one of my keys
      security: [{ session: [] }]
      parameters: [{ $ref: '#/components/parameters/ID' }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [disabled], properties: { disabled: { type: boolean } } } } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/APIKey' } } } }
        '404': { description: Not my key or not found }

  /api/billing/balance:
    get:
      tags: [Billing]
      summary: My balance in micro-USD
      security: [{ session: [] }]
      responses:
        '200': { description: Balance, content: { application/json: { schema: { $ref: '#/components/schemas/Balance' } } } }
  /api/billing/topup:
    post:
      tags: [Billing]
      summary: Top up (demo payment, credited immediately)
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [amount_usd], properties: { amount_usd: { type: number, minimum: 1, maximum: 1000 } } }
      responses:
        '200': { description: New balance, content: { application/json: { schema: { $ref: '#/components/schemas/Balance' } } } }
        '400': { $ref: '#/components/responses/Error' }
  /api/billing/topups:
    get:
      tags: [Billing]
      summary: My last 100 top-ups and admin adjustments
      security: [{ session: [] }]
      responses:
        '200': { description: Top-ups, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Topup' } } } } }
  /api/usage:
    get:
      tags: [Billing]
      summary: My usage logs with totals (50 per page)
      security: [{ session: [] }]
      parameters:
        - { $ref: '#/components/parameters/From' }
        - { $ref: '#/components/parameters/To' }
        - { $ref: '#/components/parameters/Page' }
      responses:
        '200': { description: Usage, content: { application/json: { schema: { $ref: '#/components/schemas/UsagePage' } } } }
  /api/usage/daily:
    get:
      tags: [Billing]
      summary: My requests, tokens and cost per day for the last 7 days (UTC)
      security: [{ session: [] }]
      responses:
        '200':
          description: Days
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    day: { type: string, example: '2026-11-19' }
                    requests: { type: integer }
                    tokens: { type: integer }
                    cost: { type: integer }

  /api/admin/users:
    get:
      tags: [Admin]
      summary: List users
      security: [{ session: [] }]
      responses:
        '200': { description: Users, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/User' } } } } }
        '403': { $ref: '#/components/responses/Error' }
  /api/admin/users/{id}:
    patch:
      tags: [Admin]
      summary: Change a user's role or disable them (not allowed on yourself)
      security: [{ session: [] }]
      parameters: [{ $ref: '#/components/parameters/ID' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role: { type: string, enum: [user, admin] }
                disabled: { type: boolean }
      responses:
        '200': { description: Updated user, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /api/admin/users/{id}/credit:
    post:
      tags: [Admin]
      summary: Add or deduct balance (recorded as an admin top-up)
      security: [{ session: [] }]
      parameters: [{ $ref: '#/components/parameters/ID' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [amount_usd], properties: { amount_usd: { type: number, example: -2.5 } } }
      responses:
        '200': { description: Updated user, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        '400': { description: 'Zero, out of range, or would make the balance negative' }
  /api/admin/channels:
    get:
      tags: [Admin]
      summary: List channels (API keys masked)
      security: [{ session: [] }]
      responses:
        '200': { description: Channels, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Channel' } } } } }
    post:
      tags: [Admin]
      summary: Create a channel
      security: [{ session: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ChannelInput' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Channel' } } } }
        '400': { $ref: '#/components/responses/Error' }
  /api/admin/channels/{id}:
    patch:
      tags: [Admin]
      summary: Update a channel; omitted fields and a blank api_key are kept
      security: [{ session: [] }]
      parameters: [{ $ref: '#/components/parameters/ID' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ChannelInput' } } } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/Channel' } } } }
        '404': { description: Not found }
    delete:
      tags: [Admin]
      summary: Delete a channel
      security: [{ session: [] }]
      parameters: [{ $ref: '#/components/parameters/ID' }]
      responses: { '204': { description: Deleted } }
  /api/admin/prices:
    get:
      tags: [Admin]
      summary: List model prices
      security: [{ session: [] }]
      responses:
        '200': { description: Prices, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Price' } } } } }
  /api/admin/prices/{model}:
    parameters:
      - { name: model, in: path, required: true, schema: { type: string } }
    put:
      tags: [Admin]
      summary: Create or replace a model price
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [input_per_m, output_per_m]
              properties:
                input_per_m: { type: integer, minimum: 0, example: 150000 }
                output_per_m: { type: integer, minimum: 0, example: 600000 }
      responses:
        '200': { description: Saved, content: { application/json: { schema: { $ref: '#/components/schemas/Price' } } } }
        '400': { $ref: '#/components/responses/Error' }
    delete:
      tags: [Admin]
      summary: Delete a model price (the model stops being callable)
      security: [{ session: [] }]
      responses: { '204': { description: Deleted } }
  /api/admin/usage:
    get:
      tags: [Admin]
      summary: Usage logs for everyone, or one user
      security: [{ session: [] }]
      parameters:
        - { name: user_id, in: query, schema: { type: integer } }
        - { $ref: '#/components/parameters/From' }
        - { $ref: '#/components/parameters/To' }
        - { $ref: '#/components/parameters/Page' }
      responses:
        '200': { description: Usage, content: { application/json: { schema: { $ref: '#/components/schemas/UsagePage' } } } }

components:
  securitySchemes:
    apiKey: { type: http, scheme: bearer, description: 'Gateway key, sk-...' }
    session: { type: apiKey, in: cookie, name: session }
  parameters:
    ID: { name: id, in: path, required: true, schema: { type: integer } }
    From: { name: from, in: query, schema: { type: string, format: date }, description: 'Inclusive, YYYY-MM-DD (UTC)' }
    To: { name: to, in: query, schema: { type: string, format: date }, description: 'Inclusive, YYYY-MM-DD (UTC)' }
    Page: { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
  requestBodies:
    Credentials:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [email, password]
            properties:
              email: { type: string, format: email }
              password: { type: string, minLength: 8, maxLength: 72 }
    Code:
      required: true
      content:
        application/json:
          schema: { type: object, required: [code], properties: { code: { type: string, pattern: '^[0-9]{6}$' } } }
  responses:
    Error:
      description: Error
      content: { application/json: { schema: { type: object, properties: { error: { type: string } } } } }
    OpenAIError:
      description: OpenAI-format error
      content: { application/json: { schema: { $ref: '#/components/schemas/OpenAIError' } } }
  schemas:
    Message:
      type: object
      required: [role, content]
      properties:
        role: { type: string, enum: [system, user, assistant] }
        content: { type: string, description: Plain text only }
    ChatRequest:
      type: object
      required: [model, messages]
      properties:
        model: { type: string }
        messages: { type: array, minItems: 1, items: { $ref: '#/components/schemas/Message' } }
        max_tokens: { type: integer, description: 'Default 1024; also used for the cost reservation' }
        temperature: { type: number }
        stream: { type: boolean, enum: [false] }
    ChatResponse:
      type: object
      properties:
        id: { type: string }
        object: { type: string, example: chat.completion }
        created: { type: integer }
        model: { type: string, description: The model the client asked for }
        choices:
          type: array
          items:
            type: object
            properties:
              index: { type: integer }
              message: { $ref: '#/components/schemas/Message' }
              finish_reason: { type: string, enum: [stop, length] }
        usage:
          type: object
          properties:
            prompt_tokens: { type: integer }
            completion_tokens: { type: integer }
            total_tokens: { type: integer }
    OpenAIError:
      type: object
      properties:
        error:
          type: object
          properties:
            message: { type: string }
            type: { type: string }
            code: { type: string }
    User:
      type: object
      properties:
        id: { type: integer }
        email: { type: string }
        role: { type: string, enum: [user, admin] }
        totp_enabled: { type: boolean }
        balance: { type: integer, description: micro-USD }
        disabled: { type: boolean }
        created_at: { type: string, format: date-time }
    APIKey:
      type: object
      properties:
        id: { type: integer }
        user_id: { type: integer }
        name: { type: string }
        key_prefix: { type: string }
        rpm_limit: { type: integer }
        disabled: { type: boolean }
        last_used_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
    Balance:
      type: object
      properties: { balance: { type: integer, description: micro-USD } }
    Topup:
      type: object
      properties:
        id: { type: integer }
        user_id: { type: integer }
        amount: { type: integer, description: 'micro-USD, negative for deductions' }
        source: { type: string, enum: [self, admin] }
        created_at: { type: string, format: date-time }
    UsageLog:
      type: object
      properties:
        id: { type: integer }
        user_id: { type: integer }
        api_key_id: { type: integer }
        channel_id: { type: integer, nullable: true }
        channel_name: { type: string }
        model: { type: string }
        prompt_tokens: { type: integer }
        completion_tokens: { type: integer }
        cost: { type: integer, description: micro-USD }
        status_code: { type: integer }
        latency_ms: { type: integer }
        failover_count: { type: integer }
        created_at: { type: string, format: date-time }
    UsagePage:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/UsageLog' } }
        page: { type: integer }
        page_size: { type: integer }
        count: { type: integer }
        prompt_tokens: { type: integer }
        completion_tokens: { type: integer }
        cost: { type: integer }
    Channel:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        type: { type: string, enum: [openai, anthropic] }
        base_url: { type: string }
        models: { type: array, items: { type: string } }
        model_map: { type: object, additionalProperties: { type: string } }
        priority: { type: integer }
        enabled: { type: boolean }
        api_key_masked: { type: string, example: '****1234' }
    ChannelInput:
      type: object
      properties:
        name: { type: string }
        type: { type: string, enum: [openai, anthropic] }
        base_url: { type: string, format: uri }
        api_key: { type: string }
        models: { type: array, items: { type: string } }
        model_map: { type: object, additionalProperties: { type: string }, example: { gpt-4o-mini: claude-haiku-4-5 } }
        priority: { type: integer, description: Lower is tried first }
        enabled: { type: boolean }
    Price:
      type: object
      properties:
        model: { type: string }
        input_per_m: { type: integer, description: micro-USD per 1M prompt tokens }
        output_per_m: { type: integer, description: micro-USD per 1M completion tokens }
