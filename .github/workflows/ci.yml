name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: rootpass
          MYSQL_DATABASE: gateway
          MYSQL_USER: gateway
          MYSQL_PASSWORD: gatewaypass
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -prootpass"
          --health-interval=5s --health-retries=30
    defaults:
      run:
        working-directory: backend
    env:
      TEST_MYSQL_DSN: gateway:gatewaypass@tcp(127.0.0.1:3306)/gateway?parseTime=true&charset=utf8mb4&loc=UTC
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      # Packages share one MySQL database, so they run one at a time.
      - run: go test -race -p 1 -count=1 ./...

  mockupstream:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mockupstream
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: mockupstream/go.mod
          cache: false
      - run: go vet ./...
      - run: go test -race -count=1 ./...

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  openapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: npx -y @redocly/cli@1.34.3 lint docs/openapi.yaml

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: cp .env.example .env && docker compose build

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: gosec
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.30.0
          (cd backend && gosec ./...)
          (cd mockupstream && gosec ./...)
      - name: semgrep
        run: |
          docker run --rm -v "$PWD:/src" -w /src semgrep/semgrep:1.142.0 \
            semgrep scan --error --metrics=off \
            --config p/golang --config p/react --config p/typescript \
            --config p/owasp-top-ten --config p/secrets --config p/dockerfile .
