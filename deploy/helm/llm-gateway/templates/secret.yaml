apiVersion: v1
kind: Secret
metadata:
  name: llm-gateway
  labels: {{- include "lg.labels" . | nindent 4 }}
type: Opaque
stringData:
  jwt-secret: {{ required "set jwtSecret (at least 32 characters)" .Values.jwtSecret | quote }}
  admin-password: {{ required "set adminPassword" .Values.adminPassword | quote }}
  mysql-root-password: {{ .Values.mysqlRootPassword | quote }}
  mysql-password: {{ .Values.mysqlPassword | quote }}
  rabbitmq-password: {{ .Values.rabbitmqPassword | quote }}
