# Stateful backing services: MySQL, Redis, Kafka (KRaft, one node), RabbitMQ.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  labels: {{- include "lg.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: mysql } }
  template:
    metadata: { labels: { app: mysql } }
    spec:
      enableServiceLinks: false
      containers:
        - name: mysql
          image: {{ .Values.images.mysql }}
          imagePullPolicy: {{ .Values.pullPolicy }}
          env:
            - { name: MYSQL_DATABASE, value: gateway }
            - { name: MYSQL_USER, value: gateway }
            - { name: MYSQL_ROOT_PASSWORD, valueFrom: { secretKeyRef: { name: llm-gateway, key: mysql-root-password } } }
            - { name: MYSQL_PASSWORD, valueFrom: { secretKeyRef: { name: llm-gateway, key: mysql-password } } }
          ports: [{ containerPort: 3306 }]
          readinessProbe: { tcpSocket: { port: 3306 }, periodSeconds: 5, failureThreshold: 30 }
          resources: {{- toYaml .Values.resources.default | nindent 12 }}
          volumeMounts: [{ name: data, mountPath: /var/lib/mysql }]
      volumes: [{ name: data, emptyDir: {} }]
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  labels: {{- include "lg.labels" . | nindent 4 }}
spec:
  selector: { app: mysql }
  ports: [{ port: 3306 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  labels: {{- include "lg.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector: { matchLabels: { app: redis } }
  template:
    metadata: { labels: { app: redis } }
    spec:
      enableServiceLinks: false
      containers:
        - name: redis
          image: {{ .Values.images.redis }}
          imagePullPolicy: {{ .Values.pullPolicy }}
          ports: [{ containerPort: 6379 }]
          readinessProbe: { tcpSocket: { port: 6379 }, periodSeconds: 5 }
          resources: {{- toYaml .Values.resources.default | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  labels: {{- include "lg.labels" . | nindent 4 }}
spec:
  selector: { app: redis }
  ports: [{ port: 6379 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  labels: {{- include "lg.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: kafka } }
  template:
    metadata: { labels: { app: kafka } }
    spec:
      # Without this Kubernetes injects KAFKA_PORT=tcp://..., which the image turns into a bogus broker setting.
      enableServiceLinks: false
      containers:
        - name: kafka
          image: {{ .Values.images.kafka }}
          imagePullPolicy: {{ .Values.pullPolicy }}
          env:
            - { name: KAFKA_NODE_ID, value: "1" }
            - { name: KAFKA_PROCESS_ROLES, value: "broker,controller" }
            - { name: KAFKA_LISTENERS, value: "PLAINTEXT://:9092,CONTROLLER://:9093" }
            - { name: KAFKA_ADVERTISED_LISTENERS, value: "PLAINTEXT://kafka:9092" }
            - { name: KAFKA_CONTROLLER_LISTENER_NAMES, value: CONTROLLER }
            - { name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT" }
            # The controller talks to itself over localhost, so it does not depend on the Service routing back to this pod.
            - { name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: "1@localhost:9093" }
            - { name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "1" }
            - { name: KAFKA_NUM_PARTITIONS, value: "3" }
            - { name: KAFKA_HEAP_OPTS, value: "-Xms256m -Xmx512m" }
          ports: [{ containerPort: 9092 }]
          readinessProbe: { tcpSocket: { port: 9092 }, periodSeconds: 5, failureThreshold: 40 }
          resources: {{- toYaml .Values.resources.kafka | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  labels: {{- include "lg.labels" . | nindent 4 }}
spec:
  selector: { app: kafka }
  ports: [{ port: 9092 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  labels: {{- include "lg.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: rabbitmq } }
  template:
    metadata: { labels: { app: rabbitmq } }
    spec:
      enableServiceLinks: false
      containers:
        - name: rabbitmq
          image: {{ .Values.images.rabbitmq }}
          imagePullPolicy: {{ .Values.pullPolicy }}
          env:
            - { name: RABBITMQ_DEFAULT_USER, value: gateway }
            - { name: RABBITMQ_DEFAULT_PASS, valueFrom: { secretKeyRef: { name: llm-gateway, key: rabbitmq-password } } }
          ports: [{ containerPort: 5672 }]
          readinessProbe: { tcpSocket: { port: 5672 }, periodSeconds: 5, failureThreshold: 40 }
          resources: {{- toYaml .Values.resources.default | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  labels: {{- include "lg.labels" . | nindent 4 }}
spec:
  selector: { app: rabbitmq }
  ports: [{ port: 5672 }]
